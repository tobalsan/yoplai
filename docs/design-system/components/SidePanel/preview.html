<!-- @dsCard group="Chat" height=640 subtitle="Side panel for artifacts: one-item header or tabs, resizer, close, reorder; overlay on narrow screens" -->
<!doctype html><html><head><meta charset="utf-8"><title>Side panel — preview</title><style>
[hidden] { display: none !important; }
.sp { padding: var(--space-4); height: 100vh; min-height: 560px; display: flex; flex-direction: column; gap: var(--space-3); --aura-x: 80%; --aura-y: 0%; }
.sp__bar { display: flex; gap: var(--space-2); align-items: center; flex: none; }
.sp__bar span { font: 400 12px/16px var(--font-sans); color: var(--ink-faint); margin-right: var(--space-2); }
.sp__bar .yp-btn[aria-pressed="true"] { background: var(--selected); color: var(--ink); }
.sp__view { position: relative; flex: 1; min-height: 0; display: flex; gap: var(--space-3); overflow: hidden; border-radius: var(--radius-lg); }
.sp__sheet { flex: 1; min-width: 0; overflow-y: auto; padding: var(--space-6) var(--space-5); scrollbar-width: thin; scrollbar-color: var(--line-control) transparent; border-radius: var(--radius-lg); }
.sp__view > .yp-panel:not([data-overlay]) { flex: none; height: 100%; }
</style></head><body>
<div class="yp-ground sp">
  <div class="sp__bar" role="group" aria-label="Panel state"><span>Panel</span>
    <button type="button" class="yp-btn yp-btn--sm" data-mode="one" aria-pressed="true">One item</button>
    <button type="button" class="yp-btn yp-btn--sm" data-mode="tabs" aria-pressed="false">Tabs</button>
    <button type="button" class="yp-btn yp-btn--sm" data-mode="overlay" aria-pressed="false">Overlay (narrow)</button>
  </div>
  <div class="sp__view" id="sp-view"></div>
</div>
<script>
/*@art-start*/
const YA = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const S = (d) => `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    dash: S('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
    html: S('<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M10 10.5l-2.5 2.5L10 15.5M14 10.5l2.5 2.5-2.5 2.5"/>'),
    img: S('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>'),
    pdf: S('<path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4.5"/>'),
    dl: S('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>'),
    open: S('<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
    expand: S('<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>'),
    collapse: S('<path d="M20 10h-6V4M4 14h6v6M14 10l7-7M3 21l7-7"/>'),
    x: S('<path d="M6 6l12 12M18 6L6 18"/>'),
  };

  /* ── Fixture previews: the agent's own HTML, so they bring their own palette (blue/teal/green/purple/slate; no orange) ── */
  const FXCSS = `
.fx{padding:20px;color:var(--ink);font:400 13px/18px var(--font-sans)}
.fx h4{margin:0 0 12px;font:600 14px/20px var(--font-sans)}
.fx-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container (min-width:560px){.fx-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.fx-two{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.fx-kpi{display:flex;flex-direction:column;gap:2px;min-width:0;padding:14px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}
.fx-kpi span{font-size:12px;line-height:16px;color:var(--ink-muted)}
.fx-kpi b{font:600 24px/30px var(--font-sans);font-variant-numeric:tabular-nums}
.fx-kpi em{font:500 12px/16px var(--font-sans);font-style:normal;color:var(--success)}
.fx-kpi svg{width:100%;height:24px;margin-top:6px}
.fx-stack{display:flex;flex-direction:column;gap:24px}
.fx-two{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.fx-att{display:flex;align-items:center;gap:10px;padding:10px 0;box-shadow:0 1px 0 var(--line)}
.fx-att:last-child{box-shadow:none}
.fx-tag{flex:none;padding:1px 6px;border-radius:var(--radius-xs);background:var(--warning-wash);color:var(--warning);font:500 11px/16px var(--font-sans)}
.fx-tag--b{background:var(--field);color:var(--ink-muted)}
.fx-donut{display:flex;align-items:center;gap:20px}
.fx-donut svg{flex:none;width:112px;height:112px}
.fx-leg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:16px;color:var(--ink-muted)}
.fx-leg li{display:flex;align-items:center;gap:8px}.fx-leg i{width:8px;height:8px;border-radius:2px;background:var(--c)}.fx-leg b{margin-left:auto;padding-left:12px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.fx-bars{display:flex;flex-direction:column;gap:10px}
.fx-bar{display:grid;grid-template-columns:76px 1fr 24px;gap:8px;align-items:center;font-size:12px;color:var(--ink-muted)}
.fx-bar i{display:block;height:8px;border-radius:99px;background:var(--field)}.fx-bar i b{display:block;height:100%;border-radius:inherit;background:var(--c)}
.fx-bar span:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.fx-doc{padding:28px 24px;color:#1f2328;font:400 14px/22px var(--font-sans)}
.fx-doc h1{margin:0 0 2px;font:600 22px/28px var(--font-sans)}.fx-doc p{margin:0 0 20px;color:#5a6068;font-size:13px}
.fx-doc .fx-donut{margin-bottom:24px}.fx-doc .fx-leg{color:#5a6068}.fx-doc .fx-leg b{color:#1f2328}
.fx-doc table{width:100%;border-collapse:collapse;font-size:13px}.fx-doc th{text-align:left;font-weight:500;color:#5a6068;padding:8px 0;border-bottom:1px solid #e3ded4}
.fx-doc td{padding:8px 0;border-bottom:1px solid #eee9df}.fx-doc td:not(:first-child),.fx-doc th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.fx-imgwrap{display:flex;justify-content:center;padding:var(--space-3)}.fx-img{display:block;width:100%;height:296px}
.yp-panel__page .fx-imgwrap{padding:0;height:100%}.yp-panel__page .fx-img{height:100%}
.fx-pdf{padding:20px 20px 4px}
.fx-page{box-sizing:border-box;aspect-ratio:8.5/11;max-width:460px;margin:0 auto 16px;padding:12% 10%;background:#fff;color:#1f2328;box-shadow:var(--elev-1);display:flex;flex-direction:column}
.fx-page p{margin:0;font:400 20px/30px var(--font-sans)}.fx-page small{margin-top:auto;text-align:center;font:400 11px/16px var(--font-sans);color:#8a8f98}
.yp-panel__page .fx-page{max-width:520px}
`;
  const spark = (pts, c) => {
    const mx = Math.max(...pts), mn = Math.min(...pts);
    const p = pts.map((v, i) => `${(i / (pts.length - 1) * 80).toFixed(1)},${(22 - (v - mn) / (mx - mn || 1) * 20).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 80 24" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
  };
  const donut = (segs, mid) => {
    const C = 2 * Math.PI * 42; let off = 0;
    const arcs = segs.map(([, v, c]) => { const len = C * v / 100, a = `<circle cx="60" cy="60" r="42" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += len; return a; }).join('');
    return `<svg viewBox="0 0 120 120" role="img" aria-label="Donut chart">${arcs}${mid ? `<text x="60" y="65" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">${mid}</text>` : ''}</svg>`;
  };
  const legend = (segs, suffix = '%') => `<ul class="fx-leg">${segs.map(([n, v, c]) => `<li><i style="--c:${c}"></i>${n}<b>${v}${suffix}</b></li>`).join('')}</ul>`;
  const kpi = (l, v, d, pts, c) => `<div class="fx-kpi"><span>${l}</span><b>${v}</b><em>${d}</em>${spark(pts, c)}</div>`;
  const KPIS = [
    ['Website visits', '24,100', '+1,600', [18, 19, 18.5, 20, 21, 22.5, 24.1], '#3B6FD4'],
    ['Leads', '301', '+27', [240, 252, 248, 266, 274, 290, 301], '#1F8A84'],
    ['Visit-to-lead conversion', '1.25%', '+0.03 pt', [1.18, 1.2, 1.19, 1.22, 1.21, 1.24, 1.25], '#7A55C7'],
    ['Demo requests', '36', '+5', [22, 25, 24, 28, 31, 30, 36], '#3F8F4F'],
    ['Newsletter signups', '842', '+64', [700, 730, 722, 760, 790, 778, 842], '#5B6B7F'],
    ['Avg. session', '2m 41s', '+0:09', [140, 148, 144, 152, 150, 158, 161], '#3B6FD4'],
  ];
  const PIPE_STAGES = [['Idea', 8, '#5B6B7F'], ['Drafting', 12, '#3B6FD4'], ['Review', 6, '#7A55C7'], ['Published', 24, '#1F8A84']];
  const PIPE_CH = [['Blog', 14], ['Newsletter', 9], ['Social', 21], ['Docs', 6]];
  const TRAFFIC = [['Organic search', 45, '#3B6FD4', '10,845'], ['Direct', 30, '#1F8A84', '7,230'], ['Social', 15, '#7A55C7', '3,615'], ['Referral', 10, '#5B6B7F', '2,410']];
  const DAYS = [['Mon', 128], ['Tue', 146], ['Wed', 162], ['Thu', 154], ['Fri', 171], ['Sat', 214], ['Sun', 97]];
  const FACTS = ['Coffee began in the Ethiopian highlands.', 'Monks in Yemen brewed it to stay awake through prayers.', 'Trade routes carried it to Cairo, Mecca and Istanbul.'];

  const PREV = {
    pipeline: () => `<div class="fx fx-stack"><section><h4>Needs attention</h4><div class="fx-att"><i class="fx-tag">Blocked</i><span>Meraki integration how-to</span></div><div class="fx-att"><i class="fx-tag fx-tag--b">Review</i><span>2 pieces waiting for review</span></div></section>` +
      `<div class="fx-two"><section><h4>Pieces by stage</h4><div class="fx-donut">${donut(PIPE_STAGES, '50')}${legend(PIPE_STAGES, '')}</div></section>` +
      `<section><h4>Pieces by channel</h4><div class="fx-bars">${PIPE_CH.map(([n, v]) => `<div class="fx-bar"><span>${n}</span><i><b style="--c:#3B6FD4;width:${v / 21 * 100}%"></b></i><span>${v}</span></div>`).join('')}</div></section></div></div>`,
    kpi: () => `<div class="fx"><div class="fx-kpis">${KPIS.map((k) => kpi(...k)).join('')}</div></div>`,
    traffic: () => `<div class="fx-doc"><h1>Traffic Sources Report</h1><p>Last 30 days · 24,100 visits</p><div class="fx-donut">${donut(TRAFFIC.map(([n, v, c]) => [n, v, c]))}${legend(TRAFFIC)}</div>` +
      `<table><thead><tr><th>Source</th><th>Visits</th><th>Share</th></tr></thead><tbody>${TRAFFIC.map(([n, v, , k]) => `<tr><td>${n}</td><td>${k}</td><td>${v}%</td></tr>`).join('')}</tbody></table></div>`,
    visits: () => {
      const W = 640, H = 360, base = 300, bw = 56, gap = (W - 80 - bw * 7) / 6;
      const bars = DAYS.map(([d, v], i) => { const x = 40 + i * (bw + gap), h = v / 230 * 220, hl = d === 'Sat'; return `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" fill="${hl ? '#2F5FD0' : '#C9D3E3'}"/><text x="${(x + bw / 2).toFixed(1)}" y="${base + 20}" text-anchor="middle" font-size="13" fill="#5a6068">${d}</text><text x="${(x + bw / 2).toFixed(1)}" y="${(base - h - 8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="${hl ? 600 : 400}" fill="${hl ? '#1f2328' : '#8a8f98'}">${v}</text>`; }).join('');
      return `<div class="fx-imgwrap"><svg class="fx-img" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of visits per day, Saturday highest"><rect width="${W}" height="${H}" fill="#fff"/><text x="40" y="38" font-size="16" font-weight="600" fill="#1f2328" font-family="sans-serif">Visits per day</text><line x1="32" x2="${W - 32}" y1="${base}" y2="${base}" stroke="#e3e6ea"/>${bars}</svg></div>`;
    },
    coffee: (inline, note) => `<div class="fx-pdf">${(inline ? FACTS.slice(0, 1) : FACTS).map((f, i) => `<div class="fx-page"><p>${f}</p><small>${i + 1}</small></div>`).join('')}</div>${inline ? '' : note}`,
  };
  const NOTE = 'Showing the first 50 of 60 pages. Download the file for all pages.';
  const ITEMS = {
    pipeline: { id: 'pipeline', type: 'dash', title: 'Content pipeline', meta: 'Dashboard · updated 2 min ago', bg: 'var(--surface)', file: false, prev: 'pipeline' },
    kpi: { id: 'kpi', type: 'dash', title: 'Six KPIs', meta: 'Dashboard · updated just now', bg: 'var(--surface)', file: false, prev: 'kpi' },
    traffic: { id: 'traffic', type: 'html', title: 'Traffic Sources Report', meta: 'HTML · 2.8 KB', bg: '#faf8f4', file: true, prev: 'traffic' },
    visits: { id: 'visits', type: 'img', title: 'Visits per day (sample chart)', meta: 'PNG · 11 KB', bg: '#fff', file: true, prev: 'visits' },
    coffee: { id: 'coffee', type: 'pdf', title: 'Coffee: 60 pages, one line each', meta: 'PDF · 60 pages · 72 KB', bg: 'var(--surface-sunken)', file: true, prev: 'coffee', note: NOTE },
  };
  const noteEl = (it) => `<p class="yp-artifact__note">${esc(it.note)}</p>`;
  const frame = (it, inline) => `<div class="yp-frame" data-type="${it.type}" style="--frame-bg:${it.bg}">${PREV[it.prev](inline, it.note ? noteEl(it) : '')}</div>`;

  const btn = (act, label, icon) => `<button type="button" class="yp-btn yp-btn--ghost yp-btn--icon yp-btn--sm" data-act="${act}" aria-label="${label}" title="${label}">${icon}</button>`;
  const acts = (it, ...which) => which.map((w) => (w === 'download' ? (it.file ? btn('download', 'Download', ICON.dl) : '') : w === 'open' ? btn('open', 'Open in browser', ICON.open) : w === 'expand' ? btn('expand', 'Expand', ICON.expand) : btn('collapse', 'Collapse', ICON.collapse))).join('');

  /* Inline card. state: ready | loading | error. */
  function card(it, state = 'ready') {
    const ready = state === 'ready';
    let body = '';
    if (ready) {
      body = `<div class="yp-artifact__view"><div class="yp-artifact__body" role="button" tabindex="0" data-act="expand" aria-label="Expand ${esc(it.title)}">${frame(it, true)}</div>` +
        (it.type === 'img' ? '' : `<span class="yp-artifact__more" aria-hidden="true">Expand${ICON.expand}</span>`) + `</div>${it.note ? noteEl(it) : ''}`;
    } else if (state === 'loading') {
      body = `<div class="yp-artifact__skel" aria-hidden="true"><i></i><i></i><i></i></div><p class="yp-artifact__state" role="status">${it.type === 'dash' ? 'Loading dashboard…' : 'Loading…'}</p>`;
    } else body = `<p class="yp-artifact__state" role="status">${it.type === 'dash' ? 'Dashboard unavailable' : 'View unavailable'}</p>`;
    return `<article class="yp-artifact" data-item="${it.id}" data-type="${it.type}" data-state="${state}" aria-label="${esc(it.title)}"><header class="yp-artifact__head"><span class="yp-artifact__icon">${ICON[it.type]}</span>` +
      `<div class="yp-artifact__id"><span class="yp-artifact__title" title="${esc(it.title)}">${esc(it.title)}</span><span class="yp-artifact__meta">${esc(it.meta)}</span></div>` +
      `<div class="yp-artifact__acts">${acts(it, 'download', 'open', ...(ready ? ['expand'] : []))}</div></header>${body}</article>`;
  }

  /* Marker: one style. st = open | panel | active. */
  const markState = (st) => (st === 'active' ? '<i class="yp-artifact-mark__dot"></i>In side panel' : st === 'panel' ? 'In side panel' : 'Open');
  const markLabel = (ev, st) => `${ev.verb} ${ev.title}, ${st === 'open' ? 'open in side panel' : st === 'active' ? 'in side panel, showing' : 'in side panel'}`;
  function mark(it, ev, st) {
    return `<button type="button" class="yp-artifact-mark" data-item="${it.id}" data-state="${st}" aria-label="${esc(markLabel(ev, st))}"><span class="yp-artifact-mark__icon">${ICON[it.type]}</span>` +
      `<span class="yp-artifact-mark__label"><span class="yp-artifact-mark__verb">${esc(ev.verb)}</span> ${esc(ev.title)}</span><span class="yp-artifact-mark__state">${markState(st)}</span></button>`;
  }
  function patchMark(el, ev, st) {
    if (el.dataset.state === st) return;
    el.dataset.state = st;
    el.setAttribute('aria-label', markLabel(ev, st));
    const s = $('.yp-artifact-mark__state', el), has = !!$('.yp-artifact-mark__dot', s);
    if (st === 'active' && !has) s.innerHTML = markState(st);
    else if (st !== 'active') s.innerHTML = markState(st);
  }

  /* ── Workspace: a chat thread + the side panel, wired together ── */
  function mount(o) {
    const { thread, host, panel, scrim } = o;
    const uid = Math.random().toString(36).slice(2, 6);
    const events = [];
    thread.innerHTML = o.turns.map((t) => {
      let h = `<div class="yp-msg yp-msg--user">${esc(t.user)}</div>`;
      if (t.reply) { h += `<div class="yp-msg"><p>${esc(t.reply)}</p>${t.ev ? `<div class="yp-artifact-slot" data-ev="${events.push(t.ev) - 1}"></div>` : ''}</div>`; }
      return h;
    }).join('');
    const open = [...(o.open || [])];
    let active = open[0] || null, dismissed = false, suspended = false, forced = null, overlay = false, w = 0, resized = false;
    const half = () => (host.clientWidth - 6) / 2;
    const clampW = (n) => Math.max(320, Math.min(Math.round(n), host.clientWidth - 406));
    const latest = {}; events.forEach((e, i) => { latest[e.item] = i; });
    const visible = () => open.length > 0 && !dismissed && !suspended;
    const act = (name, it) => o.onAction && o.onAction(name, it);

    panel.innerHTML = `<div class="yp-panel__resizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel" aria-valuemin="320" tabindex="0"></div><div class="yp-panel__top"></div><div class="yp-panel__body"></div>`;
    const rz = $('.yp-panel__resizer', panel), top = $('.yp-panel__top', panel), body = $('.yp-panel__body', panel);
    const pages = {};
    const tabId = (id) => `${uid}-tab-${id}`, pageId = (id) => `${uid}-page-${id}`;

    function fit() {
      requestAnimationFrame(() => $$('.yp-artifact', thread).forEach((c) => { const b = $('.yp-artifact__body', c); if (b) c.toggleAttribute('data-clip', c.dataset.type !== 'img' && b.scrollHeight > b.clientHeight + 2); }));
    }
    function renderSlots() {
      $$('.yp-artifact-slot', thread).forEach((slot) => {
        const i = +slot.dataset.ev, e = events[i], it = ITEMS[e.item], isOpen = open.includes(e.item);
        if (latest[e.item] === i && !isOpen) {
          const sig = `card|${it.title}|${it.meta}`;
          if (slot.dataset.sig !== sig) { slot.dataset.sig = sig; slot.innerHTML = card(it); }
        } else {
          const st = isOpen ? (active === e.item && visible() ? 'active' : 'panel') : 'open';
          const cur = $('.yp-artifact-mark', slot);
          if (cur) patchMark(cur, e, st); else { slot.dataset.sig = 'mark'; slot.innerHTML = mark(it, e, st); }
        }
      });
      fit();
    }

    const oneHtml = (it) => `<div class="yp-panel__head"><span class="yp-panel__icon">${ICON[it.type]}</span><div class="yp-panel__id" tabindex="-1"><div class="yp-panel__title" title="${esc(it.title)}">${esc(it.title)}</div><div class="yp-panel__meta">${esc(it.meta)}</div></div><div class="yp-panel__acts">${acts(it, 'download', 'open', 'collapse')}</div></div>`;
    const tabEl = (id) => { const it = ITEMS[id], t = document.createElement('div'); t.className = 'yp-panel__tab'; t.setAttribute('role', 'tab'); t.id = tabId(id); t.dataset.tab = id; t.draggable = true; t.setAttribute('aria-controls', pageId(id)); t.innerHTML = `${ICON[it.type]}<span class="yp-panel__tab-title" title="${esc(it.title)}">${esc(it.title)}</span><button type="button" class="yp-panel__x" tabindex="-1" data-close="${id}" aria-label="Close ${esc(it.title)}" title="Close">${ICON.x}</button>`; return t; };

    function renderTop() {
      const multi = open.length > 1, focusTab = (document.activeElement || {}).dataset && document.activeElement.dataset.tab;
      if (!multi) { top.dataset.mode = 'one'; top.innerHTML = oneHtml(ITEMS[open[0]]); return; }
      if (top.dataset.mode !== 'tabs') {
        top.dataset.mode = 'tabs';
        top.innerHTML = `<div class="yp-panel__tabs"><div class="yp-panel__track" role="presentation"><div class="yp-panel__ink"></div><div class="yp-panel__drop"></div></div></div><div class="yp-panel__bar"></div>`;
        $('.yp-panel__track', top).setAttribute('data-n', '');
        $('.yp-panel__tabs', top).setAttribute('role', 'tablist'); $('.yp-panel__tabs', top).setAttribute('aria-label', 'Open items');
      }
      const track = $('.yp-panel__track', top), drop = $('.yp-panel__drop', track);
      const have = new Map($$('.yp-panel__tab', track).map((t) => [t.dataset.tab, t]));
      have.forEach((t, id) => { if (!open.includes(id)) t.remove(); });
      open.forEach((id, i) => {
        let t = have.get(id); const fresh = !t; if (fresh) t = tabEl(id);
