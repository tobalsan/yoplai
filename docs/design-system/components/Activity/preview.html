<!-- @dsCard group="Chat" height=640 subtitle="One live line while the agent works; open it for the full history" -->
<!doctype html><html><head><meta charset="utf-8"><title>Activity — preview</title><style>
.ac { padding: var(--space-6); min-height: 100vh; --aura-x: 10%; --aura-y: 0%; }
.ac .yp-paper { max-width: 640px; padding: var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.ac .yp-activity { margin: 0; }
.ac__bar { display: flex; justify-content: space-between; align-items: center; font: 400 12px/16px var(--font-sans); color: var(--ink-faint); }
</style></head><body>
<div class="yp-ground ac"><div class="yp-paper">
  <div class="ac__bar"><span>Click the line to close or reopen the history</span><button type="button" class="yp-btn yp-btn--ghost yp-btn--sm" id="replay">Replay</button></div>
  <div id="host"></div>
</div></div>
<script>
(() => {
  const h = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };
  /* Activity live line: one swept label; click opens the history. Needs h(html) -> element. */
  const live = () => {
    const CHEV = '<svg class="yp-chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    const CHECK = '<svg class="yp-check" viewBox="0 0 16 16"><path pathLength="1" d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';
    const SPIN = '<svg class="yp-activity__spin" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 6 6"/></svg>';
    const DOT = '<span class="yp-dot yp-dot--live"></span>';
    const OK = `<i class="yp-activity__ok">${CHECK}</i>`;
    const el = h(`<details class="yp-activity" data-state="run"><summary class="yp-activity__line"><span class="yp-activity__glyph"></span><span class="yp-activity__label"></span>${CHEV}</summary><div class="yp-activity__history"></div></details>`);
    const q = (s, r = el) => r.querySelector(s);
    const [glyph, label, hist] = ['glyph', 'label', 'history'].map((c) => q('.yp-activity__' + c));
    let last, tools = 0, retries = 0;
    // Swap: the old child shrinks or slides out, the new one comes in
    const put = (box, node) => { [...box.children].forEach((c) => { c.classList.add('is-out'); setTimeout(() => c.remove(), 260); }); box.append(node); };
    const say = (g, text, sweep = true) => { put(glyph, h(g)); put(label, h(`<span${sweep ? ' class="yp-thinking__text"' : ''}>${text}</span>`)); };
    const node = (li, html) => put(q('.yp-activity__node', li), h(html));
    const meta = (li, html) => { q('.yp-activity__meta', li).innerHTML = html; };
    return {
      el,
      step({ think, label: text, name, arg, input, thought }) {
        if (!think) tools++;
        say(think ? DOT : SPIN, text);
        const li = h(`<div class="yp-activity__step yp-rise" data-state="run"><span class="yp-activity__seg"></span><span class="yp-activity__node"><i class="${think ? 'yp-activity__ring' : 'yp-activity__pulse'}"></i></span><div class="yp-activity__body"><details class="yp-activity__tool"><summary>${think ? `<span class="yp-activity__think">${text}</span>` : `<span>${name}</span><span class="yp-activity__arg">${arg}</span>`}<span class="yp-activity__meta"></span>${CHEV}</summary><div class="yp-activity__io">${think ? `<div><div class="yp-activity__k">Thought</div><p>${thought}</p></div>` : `<div><div class="yp-activity__k">Input</div><pre>${input}</pre></div><div class="yp-activity__out"><div class="yp-activity__k">Output</div><pre>Running…</pre></div>`}</div></details></div></div>`);
        if (last) last.dataset.linked = '';
        last = li; hist.append(li); return li;
      },
      done(li, { result = '', secs, output }) {
        li.dataset.state = 'done';
        if (output) { node(li, OK); q('.yp-activity__out pre', li).textContent = output; }
        meta(li, `${result}<time>${secs}</time>`);
      },
      fail(li, { why, error, secs }) {
        li.dataset.state = 'fail'; node(li, '<i class="yp-activity__bad">!</i>');
        const pre = q('.yp-activity__out pre', li); pre.textContent = error; pre.className = 'is-err';
        meta(li, `<span class="yp-activity__fail">Failed</span> · ${why}<time>${secs}</time>`);
      },
      kid(li, { name, arg, label: text }) {
        tools++; say(SPIN, text);
        let kids = q('.yp-activity__kids', li);
        if (!kids) { kids = h('<div class="yp-activity__kids"></div>'); q('.yp-activity__body', li).append(kids); }
        const row = h(`<div class="yp-activity__kid yp-rise"><span>${name} <b>${arg}</b></span><span class="yp-activity__glyph">${SPIN}</span></div>`);
        kids.append(row); return row;
      },
      kidDone(row, result) { put(q('.yp-activity__glyph', row), h(CHECK)); row.insertAdjacentHTML('beforeend', `<em>${result}</em>`); },
      retry(li, { name, arg, label: text }) {
        retries++; say(SPIN, text);
        li.append(h('<span class="yp-activity__elbow"></span>'));
        const r = h(`<div class="yp-activity__retry yp-rise"><span class="yp-activity__node"><i class="yp-activity__pulse"></i></span><span>retry</span><span class="yp-activity__arg">${name} ${arg}</span><span class="yp-activity__meta"></span></div>`);
        q('.yp-activity__body', li).append(r); return r;
      },
      retryDone(r, { result, secs }) { node(r, OK); meta(r, `${result}<time>${secs}</time>`); },
      finish(total) {
        el.dataset.state = 'done';
        say(CHECK, `Worked for ${total} · ${tools} tool call${tools === 1 ? '' : 's'}${retries ? ` · ${retries} retr${retries === 1 ? 'y' : 'ies'}` : ''}`, false);
      },
    };
  };

  /* One short run, no loop. Replay starts over. */
  const host = document.getElementById('host');
  let gen = 0;
  const wait = (g, t) => new Promise((res, rej) => setTimeout(() => (g === gen ? res() : rej()), t));
  const play = async () => {
    const g = ++gen, w = (t) => wait(g, t), t0 = performance.now();
    const a = live(); a.el.open = true; host.replaceChildren(a.el);
    try {
      await w(500);
      const s1 = a.step({ think: true, label: 'Checking which sources hold July PTO…', thought: 'July approvals live in pto_2026.xlsx; balances come from payroll. Pull both, then diff.' });
      await w(1100); a.done(s1, { secs: '1.1s' });
      const s2 = a.step({ label: 'Reading pto_2026.xlsx…', name: 'read_sheet', arg: 'pto_2026.xlsx', input: '{\n  "path": "pto_2026.xlsx"\n}' });
      await w(900); a.done(s2, { result: '412 rows', secs: '0.9s', output: '412 rows · 9 columns' });
      const s3 = a.step({ label: 'Querying payroll.july…', name: 'query', arg: 'payroll.july --team=all', input: 'payroll.july --team=all' });
      await w(300);
      for (const [arg, res] of [['approvals.csv', '38 lines'], ['payroll.csv', '38 lines']]) {
        const k = a.kid(s3, { name: 'read_file', arg, label: `Reading ${arg}…` });
        await w(500); a.kidDone(k, res);
      }
      await w(200); a.done(s3, { result: '38 people', secs: '1.5s', output: '38 people' });
      const s4 = a.step({ label: 'Posting the summary to #hr-ops…', name: 'send_slack', arg: '#hr-ops', input: '{\n  "channel": "#hr-ops"\n}' });
      await w(900); a.fail(s4, { why: 'rate limited', error: '429 rate_limited · retry after 0.6s', secs: '0.9s' });
      await w(600); const r = a.retry(s4, { name: 'send_slack', arg: '#hr-ops', label: 'Retrying #hr-ops…' });
      await w(1200); a.retryDone(r, { result: 'Posted', secs: '1.2s' });
      await w(500); a.finish(((performance.now() - t0) / 1000 - 0.5).toFixed(1) + 's');
    } catch (e) { if (e) throw e; }
  };
  document.getElementById('replay').onclick = play;
  play();
})();
</script>
</body></html>
