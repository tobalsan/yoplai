<!doctype html><html><head><meta charset="utf-8"><title>ProgressBar — preview</title><style>
.pb { padding: var(--space-6); }
.pb .yp-paper { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); max-width: 480px; }
</style></head><body>
<div class="yp-ground pb">
  <div class="yp-paper">
    <div class="yp-progress">
      <div class="yp-progress__head"><strong>5h window</strong><span>42% · resets 3:40 PM</span></div>
      <div class="yp-progress__track"><div class="yp-progress__fill" style="--value:0.42"></div></div>
    </div>
    <div class="yp-progress yp-progress--warning">
      <div class="yp-progress__head"><strong>Weekly</strong><span>78% · resets Mon 9:00 AM</span></div>
      <div class="yp-progress__track"><div class="yp-progress__fill" style="--value:0.78"></div></div>
    </div>
    <div class="yp-progress yp-progress--critical">
      <div class="yp-progress__head"><strong>Opus weekly</strong><span>93% · resets Mon 9:00 AM</span></div>
      <div class="yp-progress__track"><div class="yp-progress__fill" style="--value:0.93"></div></div>
    </div>
    <div class="yp-progress yp-progress--stale">
      <div class="yp-progress__head"><strong>Stale reading</strong><span>60% · updated 2h ago</span></div>
      <div class="yp-progress__track"><div class="yp-progress__fill" style="--value:0.60"></div></div>
    </div>
  </div>
</div>
</body></html>
