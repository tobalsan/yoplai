<!doctype html><html><head><meta charset="utf-8"><title>Badge — preview</title><style>
.bd { padding: var(--space-6); }
.bd .yp-paper { padding: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
</style></head><body>
<div class="yp-ground bd">
  <div class="yp-paper">
    <span class="yp-badge">Draft</span>
    <span class="yp-badge yp-badge--accent">Pinned</span>
    <span class="yp-badge yp-badge--success">Connected</span>
    <span class="yp-badge yp-badge--warning">Near limit</span>
    <span class="yp-badge yp-badge--danger">Failed</span>
    <span class="yp-badge yp-badge--accent"><span class="yp-dot yp-dot--live"></span>Running</span>
  </div>
</div>
</body></html>
