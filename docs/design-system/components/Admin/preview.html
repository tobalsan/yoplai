    el.innerHTML = '<div><strong>' + esc(title) + '</strong>' + esc(detail) + '</div>';

  function openMenu(menu, btn) {

  function wireMenu(menu) {
    const items = () => $$('[role^="menuitem"]', menu);
    menu.addEventListener('toggle', (e) => {
      const open = e.newState === 'open';
      if (mTrigger) mTrigger.setAttribute('aria-expanded', String(open));
      if (mRowEl) mRowEl.toggleAttribute('data-menu', open);
      if (open) items()[0].focus(); else { if (mTrigger && mTrigger.isConnected) mTrigger.focus(); mRowEl = null; }
    });
    menu.addEventListener('keydown', (e) => {
      const l = items(), i = l.indexOf(document.activeElement);
      const to = { ArrowDown: (i + 1) % l.length, ArrowUp: (i + l.length - 1) % l.length, Home: 0, End: l.length - 1 }[e.key];
      if (to !== undefined) { e.preventDefault(); l[to].focus(); } else if (e.key === 'Tab') menu.hidePopover();

  /* ── Admin. Five tabs in one sheet: Users · Extensions · MCP servers · Skills · Quota. One muted line per tab, no second title. Toolbars render once per tab and never re-render while filtering; only the list below them does. Accent: Approve (Users, pending rows) and Add server (MCP servers). Needs $, $$, esc, ms, reduced, toast, openMenu, wireMenu, I_MORE, app, and the shell (#admin-tabs #admin-desc #admin-panel #admin-scroll). ── */

  /* Segmented control (thumb moves with translate only); re-placed whenever its size changes. */
  function adSeg(seg, attr, onPick) {
    const items = $$('.yp-seg__item', seg), thumb = $('.yp-seg__thumb', seg);
    let first = true;
    const place = () => {
      const it = items.find((i) => i.getAttribute(attr) === 'true');
      if (!it || !it.offsetWidth) return;
      if (first) thumb.style.transition = 'none';
      thumb.style.width = it.offsetWidth + 'px';
      thumb.style.setProperty('--x', it.offsetLeft + 'px');
      if (first) { void thumb.offsetWidth; thumb.style.transition = ''; first = false; }
    };
    const pick = (value, silent) => {
      items.forEach((i) => i.setAttribute(attr, String(i.dataset.value === value)));
      if (attr === 'aria-selected') items.forEach((i) => { i.tabIndex = i.dataset.value === value ? 0 : -1; });
      place();
      if (!silent) onPick(value);
    };
    items.forEach((i) => i.addEventListener('click', () => { if (i.getAttribute(attr) !== 'true') pick(i.dataset.value); }));
    new ResizeObserver(place).observe(seg);
    place();
    seg._pick = pick; seg._place = place;

        return;
      }
      const s = adSkills.find((x) => x.id === id);
      if (act === 'transfer') adTransfer(s);
      else if (act === 'toggle') { s.off = !s.off; redraw(); toast(s.off ? 'Skill disabled' : 'Skill enabled', s.off ? `${s.id} can no longer be turned on.` : `${s.id} can be turned on again.`); }
      else if (await adAsk({ title: 'Delete platform-wide skill', body: `Delete ${s.id} for its owner and everyone it is shared with? This cannot be undone.`, ok: 'Delete', danger: true })) {
        adSkills.splice(adSkills.indexOf(s), 1); redraw(); toast('Skill deleted', s.id);
      }
    }
  });
  adShow('users');
})();
</script>
</body></html>
