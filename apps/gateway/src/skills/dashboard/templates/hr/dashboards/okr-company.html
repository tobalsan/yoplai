<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Company OKRs</title>
    <link rel="stylesheet" href="/d-assets/v1/kit.css" />
    <script src="/d-assets/v1/echarts.js"></script>
    <script src="/d-assets/v1/kit.js"></script>
  </head>
  <body>
    <main>
      <h1>Company OKRs</h1>
      <div id="chart" class="dk-chart"></div>
      <div id="okrs"></div>
    </main>
    <script type="application/sql" data-name="okrs" data-db="data/hr.db">
      SELECT objective,key_result,progress,status FROM okrs WHERE scope='company' ORDER BY objective
    </script>
    <script>
      const rows = YOPLAI.data.okrs;
      DashboardKit.chart("#chart", {
        xAxis: { type: "value", max: 100 },
        yAxis: { type: "category", data: rows.map((r) => r.objective) },
        series: [{ type: "bar", data: rows.map((r) => r.progress) }],
      });
      DashboardKit.table("#okrs", {
        filename: "company-okrs.csv",
        columns: [
          { key: "objective", label: "Objective" },
          { key: "key_result", label: "Key result" },
          { key: "progress", label: "Progress %" },
          { key: "status", label: "Status" },
        ],
        rows,
      });
    </script>
  </body>
</html>
