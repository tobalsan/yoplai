<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Candidate</title>
    <link rel="stylesheet" href="/d-assets/v1/kit.css" />
    <script src="/d-assets/v1/kit.js"></script>
  </head>
  <body>
    <main>
      <h1 id="name">Candidate</h1>
      <div id="cards" class="dk-grid"></div>
      <div id="details"></div>
    </main>
    <script type="application/sql" data-name="candidate" data-db="data/hr.db">
      SELECT id,name,role,stage,source,score,next_step,owner_email,updated_at FROM candidates WHERE id=:id LIMIT 1
    </script>
    <script>
      const row = YOPLAI.data.candidate[0];
      if (row) {
        document.querySelector("#name").textContent = row.name;
        document.querySelector("#cards").innerHTML =
          '<div id="stage"></div><div id="score"></div>';
        DashboardKit.kpi("#stage", { label: "Stage", value: row.stage });
        DashboardKit.kpi("#score", { label: "Score", value: row.score ?? "—" });
        DashboardKit.table("#details", {
          columns: [
            { key: "role", label: "Role" },
            { key: "source", label: "Source" },
            { key: "next_step", label: "Next step" },
            { key: "owner_email", label: "Owner" },
          ],
          rows: [row],
        });
      }
    </script>
  </body>
</html>
