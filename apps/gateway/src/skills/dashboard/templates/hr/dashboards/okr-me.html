<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>My OKRs</title>
    <link rel="stylesheet" href="/d-assets/v1/kit.css" />
    <script src="/d-assets/v1/echarts.js"></script>
    <script src="/d-assets/v1/kit.js"></script>
  </head>
  <body>
    <main>
      <h1>My OKRs</h1>
      <p id="subtitle"></p>
      <div id="summary" class="dk-grid"></div>
      <div id="okrs"></div>
    </main>
    <script type="application/sql" data-name="okrs" data-db="data/hr.db">
      SELECT objective,key_result,progress,status,updated_at FROM okrs WHERE scope='person' AND lower(owner_email)=lower(:viewer_email) ORDER BY objective
    </script>
    <script>
      const rows = YOPLAI.data.okrs;
      document.querySelector("#subtitle").textContent =
        YOPLAI.viewer.name || YOPLAI.viewer.email || "Personal view";
      const avg = rows.length
        ? Math.round(rows.reduce((n, r) => n + r.progress, 0) / rows.length)
        : 0;
      document.querySelector("#summary").innerHTML =
        '<div id="count"></div><div id="progress"></div>';
      DashboardKit.kpi("#count", { label: "Objectives", value: rows.length });
      DashboardKit.kpi("#progress", {
        label: "Average progress",
        value: avg + "%",
      });
      DashboardKit.table("#okrs", {
        filename: "my-okrs.csv",
        columns: [
          { key: "objective", label: "Objective" },
          { key: "key_result", label: "Key result" },
          { key: "progress", label: "Progress %" },
          { key: "status", label: "Status" },
        ],
        rows,
      });
    </script>
  </body>
</html>
