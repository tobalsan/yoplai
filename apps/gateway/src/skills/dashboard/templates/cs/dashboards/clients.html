<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Clients</title>
    <link rel="stylesheet" href="/d-assets/v1/kit.css" />
    <script src="/d-assets/v1/kit.js"></script>
  </head>
  <body>
    <main>
      <h1>Clients</h1>
      <div id="summary"></div>
      <div id="clients"></div>
    </main>
    <script type="application/sql" data-name="clients" data-db="data/cs.db">
      SELECT id,name,segment,health,arr,renewal_date FROM clients WHERE lower(owner_email)=lower(:viewer_email) ORDER BY arr DESC
    </script>
    <script>
      const rows = YOPLAI.data.clients;
      DashboardKit.kpi("#summary", {
        label: "Managed ARR",
        value: "$" + rows.reduce((n, r) => n + r.arr, 0).toLocaleString(),
      });
      DashboardKit.list("#clients", {
        items: rows.map((r) => ({
          label: r.name + " · " + r.health,
          value: "$" + r.arr.toLocaleString(),
          href: YOPLAI.link("client.html", { id: r.id }),
        })),
      });
    </script>
  </body>
</html>
